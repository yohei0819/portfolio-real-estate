<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国の賃貸物件一覧｜ホームナビ</title>
  <meta name="description" content="全国の賃貸マンション・アパート物件一覧。豊富な物件情報からあなたにぴったりのお部屋を探せます。">
  <meta name="theme-color" content="#e60033">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="canonical" href="https://homenavi.example.com/search.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="全国の賃貸物件一覧｜ホームナビ">
  <meta property="og:description" content="全国の賃貸マンション・アパート物件一覧">
  <meta property="og:url" content="https://homenavi.example.com/search.html">
  <meta property="og:image" content="https://homenavi.example.com/ogp.png">
  <meta property="og:site_name" content="ホームナビ">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" as="style">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="./styles/main.styl">
</head>
<body>
  <!-- スキップナビゲーション -->
  <a href="#main" class="skip-nav">メインコンテンツへスキップ</a>

  <!-- JS無効時フォールバック -->
  <noscript>
    <style>.js-fade-in { opacity: 1 !important; transform: none !important; }</style>
  </noscript>

  <!-- 共通レイアウト（ページ遷移・ヘッダー・モバイルナビ）— SiteChrome.js が注入 -->
  <div data-chrome="top"></div>

  <!-- パンくずリスト -->
  <nav class="breadcrumb" aria-label="パンくずリスト">
    <div class="breadcrumb__inner">
      <ol class="breadcrumb__list">
        <li class="breadcrumb__item"><a href="./">賃貸のホームナビ</a></li>
        <li class="breadcrumb__item" aria-current="page">賃貸物件一覧</li>
      </ol>
    </div>
  </nav>

  <main id="main">
    <div class="search-layout">
      <!-- サイドバー -->
      <aside class="sidebar">
        <form class="sidebar__form" action="./search.html" method="get">
        <div class="sidebar__section">
          <div class="sidebar__title">📍 絞り込み条件</div>
          <div class="sidebar__body">
            <p class="sidebar__label">エリア</p>
            <select class="sidebar__range-select sidebar__area-select" name="area" aria-label="エリア選択">
              <option value="">全国</option>
            </select>

            <p class="sidebar__label">賃料</p>
            <div class="sidebar__range">
              <select class="sidebar__range-select" name="rent_min" aria-label="賃料下限">
                <option value="">下限なし</option>
                <option value="3">3万円</option>
                <option value="4">4万円</option>
                <option value="5">5万円</option>
                <option value="6">6万円</option>
                <option value="7">7万円</option>
                <option value="8">8万円</option>
                <option value="9">9万円</option>
                <option value="10">10万円</option>
                <option value="12">12万円</option>
                <option value="15">15万円</option>
              </select>
              <span class="sidebar__range-separator">〜</span>
              <select class="sidebar__range-select" name="rent_max" aria-label="賃料上限">
                <option value="">上限なし</option>
                <option value="5">5万円</option>
                <option value="6">6万円</option>
                <option value="7">7万円</option>
                <option value="8">8万円</option>
                <option value="9">9万円</option>
                <option value="10">10万円</option>
                <option value="12">12万円</option>
                <option value="15">15万円</option>
                <option value="20">20万円</option>
              </select>
            </div>

            <p class="sidebar__label">間取り</p>
            <div class="sidebar__checkbox-list">
              <label><input type="checkbox" name="layout" value="1R"> ワンルーム</label>
              <label><input type="checkbox" name="layout" value="1K"> 1K</label>
              <label><input type="checkbox" name="layout" value="1DK"> 1DK</label>
              <label><input type="checkbox" name="layout" value="1LDK"> 1LDK</label>
              <label><input type="checkbox" name="layout" value="2K"> 2K</label>
              <label><input type="checkbox" name="layout" value="2DK"> 2DK</label>
              <label><input type="checkbox" name="layout" value="2LDK"> 2LDK</label>
              <label><input type="checkbox" name="layout" value="3LDK+"> 3LDK以上</label>
            </div>

            <button type="submit" class="sidebar__btn">この条件で検索</button>
          </div>
        </div>

        <div class="sidebar__section">
          <div class="sidebar__title">🏠 物件タイプ</div>
          <div class="sidebar__body">
            <div class="sidebar__checkbox-list">
              <label><input type="checkbox" name="type" value="mansion"> マンション</label>
              <label><input type="checkbox" name="type" value="apartment"> アパート</label>
              <label><input type="checkbox" name="type" value="house"> 一戸建て</label>
              <label><input type="checkbox" name="type" value="maisonette"> メゾネット</label>
            </div>
          </div>
        </div>

        <div class="sidebar__section">
          <div class="sidebar__title">📐 専有面積</div>
          <div class="sidebar__body">
            <div class="sidebar__range">
              <select class="sidebar__range-select" name="area_min" aria-label="面積下限">
                <option value="">下限なし</option>
                <option value="20">20㎡</option>
                <option value="25">25㎡</option>
                <option value="30">30㎡</option>
              </select>
              <span class="sidebar__range-separator">〜</span>
              <select class="sidebar__range-select" name="area_max" aria-label="面積上限">
                <option value="">上限なし</option>
                <option value="40">40㎡</option>
                <option value="50">50㎡</option>
                <option value="60">60㎡</option>
              </select>
            </div>
          </div>
        </div>

        <div class="sidebar__section">
          <div class="sidebar__title">⏰ 築年数</div>
          <div class="sidebar__body">
            <div class="sidebar__checkbox-list">
              <label><input type="checkbox" name="age" value="0"> 新築</label>
              <label><input type="checkbox" name="age" value="3"> 3年以内</label>
              <label><input type="checkbox" name="age" value="5"> 5年以内</label>
              <label><input type="checkbox" name="age" value="10"> 10年以内</label>
              <label><input type="checkbox" name="age" value="15"> 15年以内</label>
              <label><input type="checkbox" name="age" value="any"> 指定なし</label>
            </div>
          </div>
        </div>

        <div class="sidebar__section">
          <div class="sidebar__title">✨ こだわり条件</div>
          <div class="sidebar__body">
            <div class="sidebar__checkbox-list">
              <label><input type="checkbox" name="feature" value="parking"> 駐車場あり</label>
              <label><input type="checkbox" name="feature" value="pet"> ペット可</label>
              <label><input type="checkbox" name="feature" value="autolock"> オートロック</label>
              <label><input type="checkbox" name="feature" value="bath_toilet"> バス・トイレ別</label>
              <label><input type="checkbox" name="feature" value="aircon"> エアコン付き</label>
              <label><input type="checkbox" name="feature" value="2f_above"> 2階以上</label>
              <label><input type="checkbox" name="feature" value="corner"> 角部屋</label>
              <label><input type="checkbox" name="feature" value="flooring"> フローリング</label>
              <label><input type="checkbox" name="feature" value="delivery_box"> 宅配ボックス</label>
              <label><input type="checkbox" name="feature" value="internet"> インターネット対応</label>
            </div>
            <button type="submit" class="sidebar__btn">この条件で検索</button>
          </div>
        </div>
        </form>
      </aside>

      <!-- 物件一覧 -->
      <div class="property-list">
        <div class="property-list__header">
          <h1 class="property-list__count" id="propertyCount">
            全国の賃貸物件 <span>0</span>件
          </h1>
          <div class="property-list__sort">
            <span class="property-list__sort-label">並び替え:</span>
            <select id="sortSelect" aria-label="並び替え">
              <option value="recommended">おすすめ順</option>
              <option value="price-asc">賃料が安い順</option>
              <option value="price-desc">賃料が高い順</option>
              <option value="age-asc">築年数が新しい順</option>
              <option value="area-desc">面積が広い順</option>
            </select>
          </div>
        </div>

        <!-- 物件リストはJSで動的生成 -->
        <div class="property-list__items" id="propertyItems">
          <p class="property-list__loading" id="propertyLoading">物件を読み込み中...</p>
        </div>

        <!-- 物件なしメッセージ -->
        <p class="property-list__empty" id="propertyEmpty" hidden>
          条件に一致する物件が見つかりませんでした。条件を変更して再度お探しください。
        </p>

        <!-- ページネーション（JSで動的生成） -->
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </main>

  <!-- 共通レイアウト（フッター・トップへ戻る・各ドロワー）— SiteChrome.js が注入 -->
  <div data-chrome="bottom"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
